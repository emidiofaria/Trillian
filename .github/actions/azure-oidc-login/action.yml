# Composite action: Azure OIDC login (CD-AD-13, SEC-05, NFR-04)
# Exchanges a GitHub OIDC token for a short-lived Azure access token.
# No long-lived credentials are stored — the calling job MUST declare:
#   permissions:
#     id-token: write
#
# OIDC prerequisite: the Microsoft Entra app registration must have a federated
# identity credential whose subject matches the calling job's GitHub OIDC token
# subject (OIDC-SETUP-02/OIDC-SETUP-05).
#
# Pins: azure/login@v3
name: Azure OIDC Login
description: Authenticate to Azure using GitHub Actions OIDC (no long-lived credentials).

inputs:
  client-id:
    description: Microsoft Entra app registration client ID (AZURE_CLIENT_ID).
    required: true
  tenant-id:
    description: Azure Active Directory tenant ID (AZURE_TENANT_ID).
    required: true
  subscription-id:
    description: Azure subscription ID (AZURE_SUBSCRIPTION_ID).
    required: true

runs:
  using: composite
  steps:
    - name: Login to Azure via OIDC
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client-id }}
        tenant-id: ${{ inputs.tenant-id }}
        subscription-id: ${{ inputs.subscription-id }}
