# Composite action: Java + Gradle setup with cache (LA-04, UA-05, NFR-04)
# Pins: actions/setup-java@v5, gradle/actions/setup-gradle@v6
name: Setup Gradle
description: Install JDK 17 (Temurin), configure Gradle with caching.

runs:
  using: composite
  steps:
    - name: Set up JDK 17 (Temurin)
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: temurin

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: false
        gradle-home-cache-includes: |
          caches
          notifications
