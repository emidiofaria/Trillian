# WF-02 — Deploy (BMW-DC-CICD-001 §5)
#
# Triggered by:
#   1. PR Checks workflow completing successfully on any non-deployment branch (DP-TR-01)
#   2. Direct push to deployment/dev — hotfix bypass (DP-TR-02)
#   3. Push of a version tag v*.*.* — production release (DP-TR-03)
#   4. workflow_dispatch with environment + reason inputs (DP-TR-04)
#
# Job dependency chain:
#   build-android ─────────────────────────────────────────────────────┐
#   build-backend ─────────────────────────────────────────────────────┤→ deploy-dev
#   terraform-plan → terraform-apply-dev (dev env gate) ───────────────┘
#                                      ↓ (tag or manual prod only)
#                             terraform-apply-prod (prod gate)
#                             deploy-production   (prod gate)
#                                      ↓
#                             release-artifacts
#
# OIDC authentication: no long-lived AZURE_CREDENTIALS secret (CD-AD-13).
# Jobs exchange a GitHub OIDC token for a short-lived Azure access token.
# Required secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#
# OIDC prerequisite — Entra federated identity credentials needed (OIDC-SETUP-02):
#   Subject for dev env jobs:  repo:<org>/<repo>:environment:dev
#   Subject for prod env jobs: repo:<org>/<repo>:environment:production
#   Subject for terraform-plan (no env, branch-based):
#     repo:<org>/<repo>:ref:refs/heads/deployment/dev  (and wildcard for other branches)
#
# Action version registry (§7 — verified 2026-06-04):
#   actions/checkout@v6, actions/setup-java@v5 (temurin), actions/setup-node@v6 (node 24)
#   actions/upload-artifact@v4, actions/download-artifact@v4, gradle/actions/setup-gradle@v6
#   azure/login@v3, hashicorp/setup-terraform@v4, actions/github-script@v7

name: Deploy

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]
  push:
    branches:
      - 'main'              # auto-deploy to dev on every merge to main
      - 'deployment/dev'    # DP-TR-02: hotfix bypass; team must open post-deploy tracking issue
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'    # DP-TR-03: stable release
      - 'v[0-9]+.[0-9]+.[0-9]+-*'  # DP-TR-03: pre-release (rc, alpha, beta)
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        required: true
        default: dev
      reason:
        description: Reason for manual deployment (required for audit trail)
        type: string
        required: true

# DP-TR-05: queue concurrent runs on the same environment — do not cancel
concurrency:
  group: >-
    deploy-${{
      (github.event_name == 'workflow_dispatch' && inputs.environment) ||
      (startsWith(github.ref, 'refs/tags/v') && 'production') ||
      'dev'
    }}
  cancel-in-progress: false

# Default: least-privilege; jobs override as needed (NFR-05)
permissions:
  contents: read

# ─── Workflow-level variables ─────────────────────────────────────────────────
env:
  # Consistent commit SHA across all trigger types (NFR-06).
  # workflow_run: use the triggering workflow's head SHA; other triggers: github.sha.
  COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

  # APK output paths — single source of truth for Gradle build output locations.
  # Update here if the build variant or output directory changes.
  APK_DEBUG_PATH: app/build/outputs/apk/debug/app-debug.apk
  APK_RELEASE_PATH: app/build/outputs/apk/release/app-release.apk

  # Backend URLs — fall back to mock values until Azure infrastructure is provisioned.
  # Override by setting BACKEND_DEV_URL / BACKEND_PROD_URL as GitHub repo variables
  # in Settings → Environments → dev/production. (TODO(infra): set real URLs)
  BACKEND_DEV_URL: ${{ vars.BACKEND_DEV_URL || 'https://bmw-driving-coach-dev.azurewebsites.net' }}
  BACKEND_PROD_URL: ${{ vars.BACKEND_PROD_URL || 'https://bmw-driving-coach.azurewebsites.net' }}

jobs:

  # ──────────────────────────────────────────────────────────────────────────────
  # Shared gate: skip everything when triggered by a failed pr-checks run (GT-02)
  # ──────────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────────
  # Log manual dispatch reason (DP-TR-04)
  # ──────────────────────────────────────────────────────────────────────────────
  log-reason:
    name: Log dispatch reason
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Print reason
        run: |
          echo "Manual deployment triggered"
          echo "Environment : ${{ inputs.environment }}"
          echo "Reason      : ${{ inputs.reason }}"

  # ──────────────────────────────────────────────────────────────────────────────
  # build-android (BA-01 – BA-05)
  # ──────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45  # RN-04
    # GT-02: skip if pr-checks failed; other triggers always proceed
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/decode-google-services
        with:
          google-services-base64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        # BA-02

      - name: Decode keystore
        run: |
          KEYSTORE_PATH="${RUNNER_TEMP}/release.keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${KEYSTORE_PATH}"
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
        # BA-03, CD-AD-10, SEC-02

      - uses: ./.github/actions/setup-gradle

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        # BA-01, BA-03

      - name: Normalize release APK filename
        run: |
          expected="${{ env.APK_RELEASE_PATH }}"
          if [ ! -f "$expected" ]; then
            produced="$(find "$(dirname "$expected")" -maxdepth 1 -name '*.apk' | head -n1)"
            [ -n "$produced" ] || { echo "::error::No release APK found in $(dirname "$expected")"; exit 1; }
            cp "$produced" "$expected"
          fi
        # app/build.gradle.kts renames outputs to DrivingCoach-v<version>-<variant>.apk;
        # copy to the stable path the rest of the pipeline references.

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ env.COMMIT_SHA }}
          path: ${{ env.APK_RELEASE_PATH }}
          retention-days: 90
          if-no-files-found: error
        # BA-04, CD-AD-11

      - name: Upload ProGuard mapping (placeholder until R8 enabled)
        uses: actions/upload-artifact@v4
        with:
          name: android-proguard-mapping-${{ env.COMMIT_SHA }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
        # BA-05

  # ──────────────────────────────────────────────────────────────────────────────
  # build-backend (BB-01 – BB-03)
  # ──────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15  # RN-04
    if: false  # Backend CI disabled
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/setup-node-backend

      - name: Compile TypeScript
        working-directory: backend
        run: npm run build
        # BB-01, BB-03: fails if tsc reports errors

      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist-${{ env.COMMIT_SHA }}
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
          retention-days: 90
          if-no-files-found: error
        # BB-02

  # ──────────────────────────────────────────────────────────────────────────────
  # terraform-plan (TF-01 – TF-07)
  #
  # OIDC note: this job runs without a GitHub environment, so the federated
  # identity credential subject is branch-based:
  #   repo:<org>/<repo>:ref:refs/heads/<branch>  (for branch pushes)
  #   repo:<org>/<repo>:ref:refs/tags/<tag>       (for tag pushes)
  # A wildcard federated credential or a dedicated "plan" credential must be
  # created on the Entra app registration (OIDC-SETUP-02).
  # ──────────────────────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 30  # RN-04
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write      # SEC-05: required for OIDC token exchange
      pull-requests: write # TF-05: post plan as PR comment

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # TF-02, CD-AD-13

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version_file: .terraform-version
        # TF-01

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init
        # TF-04
        # TODO(infra): add -backend-config flags once Azure Storage backend is provisioned (TF-03)
        # Example:
        #   terraform init \
        #     -backend-config="resource_group_name=${TF_BACKEND_RG}" \
        #     -backend-config="storage_account_name=${TF_BACKEND_SA}" \
        #     -backend-config="container_name=tfstate" \
        #     -backend-config="key=bmw-driving-coach.tfstate"
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform validate
        working-directory: infrastructure
        run: terraform validate
        # TF-04

      - name: Terraform plan
        id: tf-plan
        working-directory: infrastructure
        run: |
          terraform plan -out=tfplan -no-color 2>&1 | tee tf-plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        # TF-04
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/tf-plan-output.txt', 'utf8');
            const body = `## Terraform Plan\n\`\`\`\n${plan.slice(0, 65000)}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
        # TF-05

      - name: Upload tfplan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.COMMIT_SHA }}
          path: infrastructure/tfplan
          retention-days: 7
          if-no-files-found: warn
        # TF-06

  # ──────────────────────────────────────────────────────────────────────────────
  # terraform-apply-dev (TF-08 – TF-10)
  # ──────────────────────────────────────────────────────────────────────────────
  terraform-apply-dev:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # RN-04
    needs: [terraform-plan]
    environment: dev   # SEC-04: no required reviewer; auto-proceeds
    permissions:
      contents: read
      id-token: write  # SEC-05

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # TF-09, CD-AD-13

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version_file: .terraform-version

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.COMMIT_SHA }}
          path: infrastructure/
        # TF-08

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init
        # TODO(infra): add -backend-config once backend is provisioned
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan
        # TF-08: non-interactive apply; TF-10: failure here blocks deploy-dev
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ──────────────────────────────────────────────────────────────────────────────
  # deploy-dev (DD-01 – DD-06)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 30  # RN-04
    needs: [terraform-apply-dev, build-android]  # build-backend disabled
    environment:
      name: dev
      url: ${{ env.BACKEND_DEV_URL }}
    permissions:
      contents: read
      id-token: write      # SEC-05: OIDC for Azure
      deployments: write   # DD-06: post deployment status

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # DD-01, CD-AD-13

      - uses: ./.github/actions/setup-node-backend
        if: false  # Backend CI disabled

      - name: Download backend dist
        if: false  # Backend CI disabled
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ env.COMMIT_SHA }}
          path: backend/

      - name: Run database migrations
        if: false  # Backend CI disabled
        working-directory: backend
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # DD-03

      - name: Deploy backend to Azure App Service
        if: false  # Backend CI disabled
        # TODO(infra): replace with azure/webapps-deploy@v3 once App Service is provisioned
        # Target: Azure App Service for the dev environment (CD-AD-02)
        run: echo "[PLACEHOLDER] Backend deployment to dev — infrastructure TBD"
        # DD-02

      - name: Health check
        if: false  # Backend CI disabled
        # TODO(infra): replace placeholder with real check once App Service is live (DD-04)
        # Real implementation:
        #   for i in $(seq 1 5); do
        #     STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${{ env.BACKEND_DEV_URL }}/health" || echo "000")
        #     [ "$STATUS" = "200" ] && exit 0 || sleep 15
        #   done; exit 1
        run: echo "[PLACEHOLDER] Health check ${{ env.BACKEND_DEV_URL }}/health — backend TBD"
        # DD-04

      - name: Re-upload APK as traceable dev artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk-${{ env.COMMIT_SHA }}
          path: /tmp/apk/
        # DD-05 (download before re-upload)

      - name: Upload dev-tagged APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-dev-${{ env.COMMIT_SHA }}
          path: /tmp/apk/   # contains app-release.apk downloaded from android-release-apk artifact
          retention-days: 7
        # DD-05, CD-AD-11

  # ──────────────────────────────────────────────────────────────────────────────
  # terraform-apply-prod (TF-11 – TF-12)
  # Runs only for version tag pushes or manual production dispatch
  # ──────────────────────────────────────────────────────────────────────────────
  terraform-apply-prod:
    name: Terraform Apply (production)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # RN-04
    needs: [deploy-dev]
    if: >-
      needs.deploy-dev.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    environment: production   # SEC-03: required reviewer gate (CD-AD-12)
    permissions:
      contents: read
      id-token: write  # SEC-05

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # TF-09, CD-AD-13

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version_file: .terraform-version

      - name: Download tfplan artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.COMMIT_SHA }}
          path: infrastructure/
        # TF-11

      - name: Terraform init
        working-directory: infrastructure
        run: terraform init
        # TODO(infra): add -backend-config once backend is provisioned
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan
        # TF-11, TF-12: must complete before deploy-production
        env:
          ARM_USE_OIDC: 'true'
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # ──────────────────────────────────────────────────────────────────────────────
  # deploy-production (DP-01 – DP-06)
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30  # RN-04
    needs: [terraform-apply-prod]
    if: >-
      needs.terraform-apply-prod.result == 'success'
    environment:
      name: production
      url: ${{ env.BACKEND_PROD_URL }}
    permissions:
      contents: read
      id-token: write      # SEC-05
      deployments: write   # DP-06

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        # DP-02, CD-AD-13

      - uses: ./.github/actions/setup-node-backend
        if: false  # Backend CI disabled

      - name: Download backend dist
        if: false  # Backend CI disabled
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ env.COMMIT_SHA }}
          path: backend/

      - name: Run database migrations
        if: false  # Backend CI disabled
        working-directory: backend
        run: npm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # DP-04

      - name: Deploy backend to Azure App Service (production)
        if: false  # Backend CI disabled
        # TODO(infra): replace with azure/webapps-deploy@v3 once App Service is provisioned
        run: echo "[PLACEHOLDER] Backend deployment to production — infrastructure TBD"
        # DP-03

      - name: Health check
        if: false  # Backend CI disabled
        # TODO(infra): replace placeholder with real check once App Service is live (DP-05)
        # Real implementation mirrors the dev health check using ${{ env.BACKEND_PROD_URL }}
        run: echo "[PLACEHOLDER] Health check ${{ env.BACKEND_PROD_URL }}/health — backend TBD"
        # DP-05

  # ──────────────────────────────────────────────────────────────────────────────
  # release-artifacts (RA-01 – RA-06)
  # Creates a GitHub Release with the signed APK attached.
  # Only runs on version tag pushes (production releases via workflow_dispatch
  # re-use an existing tag — use gh release edit to update an existing release).
  # ──────────────────────────────────────────────────────────────────────────────
  release-artifacts:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-production]
    if: >-
      needs.deploy-production.result == 'success' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # RA-02: create GitHub Release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0   # RA-03: need full history for git log between tags

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk-${{ env.COMMIT_SHA }}
          path: /tmp/release/
        # RA-01

      - name: Download ProGuard mapping
        uses: actions/download-artifact@v4
        with:
          name: android-proguard-mapping-${{ env.COMMIT_SHA }}
          path: /tmp/release/
          # mapping.txt may not exist until R8 is enabled (BA-05 placeholder)
        continue-on-error: true

      - name: Download backend dist
        if: false  # Backend CI disabled
        uses: actions/download-artifact@v4
        with:
          name: backend-dist-${{ env.COMMIT_SHA }}
          path: /tmp/backend-dist/
        # RA-06

      - name: Rename APK to release convention
        run: |
          VERSION="${GITHUB_REF_NAME}"
          APK_FILENAME="$(basename "${{ env.APK_RELEASE_PATH }}")"
          mv "/tmp/release/${APK_FILENAME}" "/tmp/release/bmw-driving-coach-${VERSION}-release.apk"
          echo "APK_NAME=bmw-driving-coach-${VERSION}-release.apk" >> "$GITHUB_ENV"
        # RA-05

      - name: Package backend dist
        if: false  # Backend CI disabled
        run: |
          VERSION="${GITHUB_REF_NAME}"
          tar -czf "/tmp/release/backend-dist-${VERSION}.tar.gz" -C /tmp/backend-dist .
          echo "BACKEND_DIST_NAME=backend-dist-${VERSION}.tar.gz" >> "$GITHUB_ENV"
        # RA-06

      - name: Generate release notes
        id: notes
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --abbrev=0 --tags "${CURRENT_TAG}^" 2>/dev/null || echo "")
          if [ -n "${PREV_TAG}" ]; then
            NOTES=$(git log "${PREV_TAG}...${CURRENT_TAG}" --oneline)
          else
            NOTES=$(git log "${CURRENT_TAG}" --oneline)
          fi
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "${NOTES}" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
        # RA-03

      - name: Detect pre-release
        id: prerelease
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if echo "${VERSION}" | grep -qE '\-'; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
        # RA-04: tag with hyphen suffix (e.g. v1.2.3-rc.1) → pre-release

      - name: Create GitHub Release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "/tmp/release/${APK_NAME}" \
            $(test -f /tmp/release/mapping.txt && echo "/tmp/release/mapping.txt" || true) \
            --title "${GITHUB_REF_NAME}" \
            --notes "${RELEASE_NOTES}" \
            $( [ "${IS_PRERELEASE}" = "true" ] && echo "--prerelease" || echo "--latest" )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # RA-02, RA-04, RA-05, RA-06
