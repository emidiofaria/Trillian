# =============================================================================
# AVD Configuration Template — DrivingCoach_Test
# =============================================================================
# This file documents the AVD configuration used for automated testing.
# The actual AVD is created by setup-emulator.sh using avdmanager.
#
# ASPICE: Supports L2_SWE5_integration and L3_SWE6_qualification
# =============================================================================

# Device Profile
hw.device.name=pixel_4
hw.device.manufacturer=Google

# Display
hw.lcd.density=440
hw.lcd.width=1080
hw.lcd.height=2280
skin.name=pixel_4

# Memory
hw.ramSize=2048
vm.heapSize=256

# Storage
disk.dataPartition.size=2G
sdcard.size=512M

# CPU
hw.cpu.ncore=4

# GPU (software rendering for headless)
hw.gpu.enabled=yes
hw.gpu.mode=swiftshader_indirect

# Sensors (important for Driving Coach)
hw.accelerometer=yes
hw.gyroscope=yes
hw.gps=yes
hw.sensors.proximity=yes
hw.sensors.magnetic_field=yes

# Network
hw.wifi=yes

# Audio (disabled for headless)
hw.audioInput=no
hw.audioOutput=no

# Camera (disabled)
hw.camera.back=none
hw.camera.front=none

# =============================================================================
# Notes
# =============================================================================
# 
# API Level: 30 (Android 11)
# System Image: system-images;android-30;google_apis;x86_64
#
# This configuration is optimized for:
# - Headless execution (no window, no audio)
# - GPS/sensor availability (for telemetry tests)
# - Reasonable performance on CI servers
#
# To create AVD manually:
#   avdmanager create avd \
#     --name DrivingCoach_Test \
#     --package "system-images;android-30;google_apis;x86_64" \
#     --device pixel_4
#
# To start with these settings:
#   emulator -avd DrivingCoach_Test \
#     -no-window -no-audio -no-boot-anim \
#     -gpu swiftshader_indirect
# =============================================================================
